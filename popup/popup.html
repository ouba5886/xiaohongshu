      </div>

        <span class="feature-icon">🖼️</span>
        <div class="feature-text">
          <strong>照片强制转码为标准 JPG 格式</strong>
          <span>内置 Canvas 引擎，兼容所有看图软件与设备</span>
        </div>
      </div>
    </div>

    <div class="popup-actions">
      <button id="btn-open-xhs" class="btn-primary">打开小红书网页版</button>
      <button id="btn-open-downloads" class="btn-secondary">打开浏览器下载目录</button>
